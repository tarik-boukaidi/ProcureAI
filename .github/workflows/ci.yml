
name: ProcureAI CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - discovery-service
          - auth-service
          - supplier-service
          - procurement-service
          - order-service
          - reception-service
          - invoice-service
          - matching-service
          - payment-service
          - accounting-service
          - notification-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build and test
        working-directory: ${{ matrix.service }}
        run: mvn -B verify
