# Seuls api-gateway (8080), frontend (3000) et Eureka (8761) exposent un port.
# Les autres services n'ont PAS de "ports:" : ils sont accessibles
# uniquement a l'interieur du reseau Docker, donc seulement via le gateway.

# Cle JWT definie une seule fois, partagee par auth-service et api-gateway
x-jwt-secret: &jwt-secret "7fK9mQ2xV8pL4zN6sR1tY5wC3hJ8aD0eG6uP2kF9vX4mB7qZ"

# Adresse d'Eureka, partagee par tous les services
x-eureka-url: &eureka-url "http://discovery-service:8761/eureka"
# Identifiants de developpement local, surchargeables dans infrastructure/.env
x-rabbitmq-user: &rabbitmq-user "${RABBITMQ_USER:-procureai}"
x-rabbitmq-password: &rabbitmq-password "${RABBITMQ_PASSWORD:-procureai}"

services:

  postgres:
    image: postgres:16
    # 10 services x 10 connexions (pool Hikari par defaut) = 100 = limite par defaut de Postgres
    command: postgres -c max_connections=200
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Execute seulement au premier demarrage (volume vide)
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: *rabbitmq-user
      RABBITMQ_DEFAULT_PASS: *rabbitmq-password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  discovery-service:
    build: ../discovery-service
    # Tableau de bord Eureka : http://localhost:8761
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  auth-service:
    build: ../auth-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: *jwt-secret
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: *eureka-url
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_started

  supplier-service:
    build: ../supplier-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/supplier_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: *eureka-url
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_started

  order-service:
    build: ../order-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: *eureka-url
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: *rabbitmq-user
      SPRING_RABBITMQ_PASSWORD: *rabbitmq-password
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  procurement-service:
    build: ../procurement-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/procurement_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: *eureka-url
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: *rabbitmq-user
      SPRING_RABBITMQ_PASSWORD: *rabbitmq-password
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  reception-service:
    build: ../reception-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/reception_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: *eureka-url
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_started

  invoice-service:
    build: ../invoice-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/invoice_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: *eureka-url
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: *rabbitmq-user
      SPRING_RABBITMQ_PASSWORD: *rabbitmq-password
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  matching-service:
    build: ../matching-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/matching_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: *eureka-url
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_started

  payment-service:
    build: ../payment-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: *eureka-url
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_started

  notification-service:
    build: ../notification-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: *eureka-url
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: *rabbitmq-user
      SPRING_RABBITMQ_PASSWORD: *rabbitmq-password
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  accounting-service:
    build: ../accounting-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/accounting_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: *eureka-url
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_started

  # Service Python (FastAPI + PaddleOCR), pas de base de donnees
  # Demarre en quelques secondes : il doit attendre qu'Eureka soit pret
  ai-service:
    build: ../ai-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: *eureka-url
      # Cle dans infrastructure/.env (GEMINI_API_KEY=...). Vide : l'OCR utilise les regex
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      discovery-service:
        condition: service_healthy

  api-gateway:
    build: ../api-gateway
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: *jwt-secret
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: *eureka-url
    depends_on:
      - discovery-service

  # React construit puis servi par Nginx, sur http://localhost:3000
  frontend:
    build: ../frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway

volumes:
  postgres_data:
  rabbitmq_data:
