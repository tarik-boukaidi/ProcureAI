  ai-service:
    image: 093747269849.dkr.ecr.us-east-1.amazonaws.com/procureai/ai-service:build-7
    restart: unless-stopped
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: *eureka-url
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      discovery-service:
        condition: service_healthy

  api-gateway:
    image: 093747269849.dkr.ecr.us-east-1.amazonaws.com/procureai/api-gateway:build-7
    restart: unless-stopped
    environment:
      JWT_SECRET: *jwt-secret
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: *eureka-url
    depends_on:
      discovery-service:
        condition: service_healthy

  frontend:
    image: 093747269849.dkr.ecr.us-east-1.amazonaws.com/procureai/frontend:build-10
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api-gateway:
        condition: service_started

volumes:
  postgres_data:
  rabbitmq_data:
