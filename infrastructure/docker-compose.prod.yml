  notification-service:
    image: 093747269849.dkr.ecr.us-east-1.amazonaws.com/procureai/notification-service:build-7
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: *postgres-password
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: *eureka-url
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: *rabbitmq-user
      SPRING_RABBITMQ_PASSWORD: *rabbitmq-password
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  accounting-service:
    image: 093747269849.dkr.ecr.us-east-1.amazonaws.com/procureai/accounting-service:build-7
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/accounting_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: *postgres-password
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: *eureka-url
    depends_on:
