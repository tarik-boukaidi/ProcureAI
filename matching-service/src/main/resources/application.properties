spring.application.name=matching-service
server.port=8087

# Base de donnees PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/matching_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Enregistrement aupres d'Eureka (discovery-service)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# Ecart de prix accepte entre la facture et la commande (en %)
matching.price-tolerance-percent=0
