server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Les appels /api partent vers le gateway : meme adresse que le site, donc pas de CORS
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        client_max_body_size 20m;
    }

    # Toutes les autres URL renvoient index.html (routes React)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
