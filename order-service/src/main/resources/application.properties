spring.application.name=order-service
server.port=8084

# Base de donnees PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/order_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Enregistrement aupres d'Eureka (discovery-service)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# E-mail au fournisseur quand une commande est envoyee.
# Sans MAIL_HOST, l'e-mail est seulement ecrit dans les logs.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:noreply@procureai.local}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
