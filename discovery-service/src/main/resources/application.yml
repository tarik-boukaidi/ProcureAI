server:
  port: 8761

spring:
  application:
    name: discovery-service

eureka:
  client:
    # Le serveur Eureka ne s'enregistre pas aupres de lui-meme
    register-with-eureka: false
    fetch-registry: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always